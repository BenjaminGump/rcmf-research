schema_version: rcmf_portable_pipeline_config_v2_1
adapter_factory: rcmf.benchmarks.alfworld.portable_adapter_v2:create_alfworld_portable_adapter_v2_1
adapter_factory_kwargs: {}
phase_executor_factory: rcmf.benchmarks.alfworld.portable_executor_v2_1:create_alfworld_portable_executor_v2_1
dataset_profile: configs/datasets/alfworld_v1.yaml
run_root_template: runs/alfworld/{benchmark}/{run_uuid}
runtime:
  run_mode: full
  prompt_profile: react_task_type_two_demo_v1
  global_seed: 25101
  training_epochs: 1
  checkpoint_policy: terminal_completed_epoch
  authorization_required: true
  no_metric_checkpoint_selection: true
  no_checkpoint_fallback: true
  model_frozen: true
  selector_frozen_after_training: true
  runtime_retrieval: false
  raw_memory_in_query_prompt: false
